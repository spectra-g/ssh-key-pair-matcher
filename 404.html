<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, follow" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="theme-color"
      content="#f4f7f6"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#07110e"
      media="(prefers-color-scheme: dark)"
    />
    <meta
      name="description"
      content="The requested SSH Key Pair Matcher page could not be found."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/src/styles.css" />
    <title>Page not found | SSH Key Pair Matcher</title>

  <body class="error-page">
    <main>
      <section class="error-card" aria-labelledby="error-heading">
        <p class="eyebrow">Error 404</p>
        <h1 id="error-heading">That page does not exist</h1>
        <p>
          The address may be mistyped or the page may have moved. The SSH key
          matcher is available from the home page.
        </p>
        <a class="button button--primary" href="/">Return to the matcher</a>
      </section>
    </main>
  </body>
</html>
